services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # botuser precisa do grupo "docker" do host para acessar /var/run/docker.sock
    # (gid 990 no NUC — checar `getent group docker` se mudar de host)
    group_add:
      - "990"
    volumes:
      - vault_data:/app/vault
      - ./credencials.json:/run/secrets/google_credentials:ro
      - ./token.json:/run/secrets/google_token
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /:/host/root:ro
      - /home/glitch/glitch-dashboard/api:/app/dashboard_shared
      - ./infra_ssh_key:/run/secrets/infra_ssh_key:ro
    environment:
      - GOOGLE_CREDENTIALS_JSON=/run/secrets/google_credentials
      - GOOGLE_TOKEN_JSON=/run/secrets/google_token
    networks:
      - default
      - collab-hub-network

volumes:
  vault_data:

networks:
  default:
  collab-hub-network:
    external: true
